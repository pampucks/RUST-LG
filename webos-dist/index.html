<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LG DIGITAL SIGNAGE (WASM Core)</title>
    <link rel="stylesheet" href="Main.css" type="text/css" />

    <script src="SCAP_Library-official-1.8.2-20260127/js/webOS.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova/2.7.0/cordova.webos.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/custom.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova-cd/deviceInfo.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova-cd/configuration.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova-cd/storage.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova-cd/signage.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/cordova-cd/power.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/jquery-3.5.1.min.js"></script>
    <script src="SCAP_Library-official-1.8.2-20260127/js/qrcode.min.js"></script>

    <script type="module">
      import init, {
        process_signage_command,
        process_hardware_event,
        evaluate_hardware_routing,
        check_transaction_timeouts,
        get_core_state,
        clear_storage,
        write_log,
        tick_check_playlist,
        tick_check_connection,
        tick_check_content,
        tick_update_status,
        tick_sync_capture,
        tick_send_log,
        tick_check_version,
      } from "./pkg/rust_lg_adapter.js";

      import { wasmBase64 } from "./pkg/wasm_bytes.js";

      // Bind the missing global 'log' symbol that Rust is expecting
      window.log = console.log.bind(console);

      function base64ToUint8Array(b64) {
        const binString = atob(b64);
        const bytes = new Uint8Array(binString.length);
        for (let i = 0; i < binString.length; i++) {
          bytes[i] = binString.charCodeAt(i);
        }
        return bytes;
      }

      function bootWasm() {
        const wasmBytes = base64ToUint8Array(wasmBase64);

        // Pass the bytes wrapped inside the modern configuration layout
        init({ module_or_path: wasmBytes }).then(() => {
          // Standard binding mappings
          window.rust_process_signage_command = process_signage_command;
          window.rust_process_hardware_event = process_hardware_event;
          window.rust_evaluate_hardware_routing = evaluate_hardware_routing;
          window.rust_check_transaction_timeouts = check_transaction_timeouts;
          window.rust_get_core_state = get_core_state;
          window.rust_tick_check_playlist = tick_check_playlist;
          window.rust_tick_check_connection = tick_check_connection;
          window.rust_tick_check_content = tick_check_content;
          window.rust_tick_update_status = tick_update_status;
          window.rust_tick_sync_capture = tick_sync_capture;
          window.rust_tick_send_log = tick_send_log;
          window.rust_tick_check_version = tick_check_version;
          window.rust_clear_storage = clear_storage;
          window.rust_write_log = write_log;

          let webosFirmwareVersion = 6; // Baseline clean firmware fallback detection variable
          try {
            if (
              window.webOS &&
              window.webOS.platform &&
              window.webOS.platform.tv
            ) {
              let major = parseInt(window.webOS.platform.tv, 10);
              if (!isNaN(major)) webosFirmwareVersion = major;
            }
          } catch (e) {
            console.error(
              "Platform sniffing unavailable, defaulting to simulation.",
              e
            );
          }

          // 🚀 UNIFIED ENTRYPOINT HANDOFF: Kick off the system loop directly via Rust!
          console.log(
            "[Boot] WASM ready. Firing evaluate_hardware_routing with version:",
            webosFirmwareVersion
          );

          // 💡 Inject the global safety wrapper here:
          if (typeof window.rust_process_hardware_event === "function") {
            const nativeRustHandler = window.rust_process_hardware_event;
            window.rust_process_hardware_event = function (jsonResponseString) {
              setTimeout(function () {
                nativeRustHandler(jsonResponseString);
              }, 0);
            };
          }

          window.rust_evaluate_hardware_routing(webosFirmwareVersion);

          // Clear the gatekeeper screens layout layers gracefully // TODO
          // if (typeof window.hideGatekeeper === "function") {
          //   window.hideGatekeeper();
          // }

          setInterval(() => {
            window.rust_check_transaction_timeouts(Date.now());
          }, 1000);
        });
      }

      // ✅ Wait for cordova to finish before booting WASM
      // Falls back immediately if cordova never fires (pure browser)
      var cordovaReady = false;
      document.addEventListener(
        "deviceready",
        function () {
          // Add this BEFORE bootWasm() is called, inside the setTimeout fallback or deviceready
          const _original = window.scapCallbackBridge;
          window.scapCallbackBridge = function (str) {
            console.log(
              "[INTERCEPT] Rust called scapCallbackBridge with:",
              str
            );
            return _original(str);
          };

          console.log("[Boot] Cordova deviceready fired.");
          cordovaReady = true;
          bootWasm();
        },
        false
      );

      // Fallback: if deviceready doesn't fire within 3s, boot anyway
      setTimeout(function () {
        if (!cordovaReady) {
          // Add this BEFORE bootWasm() is called, inside the setTimeout fallback or deviceready
          const _original = window.scapCallbackBridge;
          window.scapCallbackBridge = function (str) {
            console.log(
              "[INTERCEPT] Rust called scapCallbackBridge with:",
              str
            );
            return _original(str);
          };

          console.warn(
            "[Boot] Cordova deviceready timeout — booting in simulation mode."
          );
          bootWasm();
        }
      }, 3000);
    </script>
  </head>
  <body>
    <div
      id="compatibilityGatekeeper"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #111;
        color: #fff;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
      "
    >
      <h1 id="gatekeeperTitle" style="margin-bottom: 10px">
        Initializing Application...
      </h1>
      <p id="gatekeeperMessage" style="color: #aaa; font-size: 18px">
        Checking system compatibility.
      </p>
    </div>

    <div
      id="bootScreen"
      style="
        display: block;
        background-color: #ffffff;
        height: 100%;
        width: 100%;
        position: absolute;
        z-index: 100;
      "
    >
      <div
        style="
          display: block;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          text-align: center;
        "
      >
        <div
          id="processStats"
          style="font-family: sans-serif; font-size: 24px; color: #333"
        >
          Initializing Rust Core State Engine...
        </div>
      </div>
    </div>

    <div id="tabBar">
      <div id="tabCurrent" class="tabClass">Current Status</div>
      <div id="tabCampaign" class="tabClass inactive">All Playlist</div>
      <div id="tabVideo" class="tabClass inactive">Content Logs</div>
      <div id="tabPlayer" class="tabClass inactive">Player Logs</div>
      <div id="tabWrite" class="tabClass inactive">Write Logs</div>
      <div id="tabSync" class="tabClass inactive">Socket Logs</div>
    </div>

    <div id="idStatus"></div>
    <div id="currentStatus" tabindex="0"></div>
    <div id="syncStatus" tabindex="0"></div>
    <div id="videoStatus" tabindex="0"></div>
    <div id="playerStatus" tabindex="0"></div>
    <div id="writeStatus" tabindex="0"></div>
    <div id="campaignLog" tabindex="0"></div>

    <div id="captureImage">
      <p
        id="timeCapture"
        style="color: black; background-color: rgba(255, 255, 255, 0.5)"
      ></p>
    </div>

    <div id="downResult"></div>
    <div id="lastStatus"></div>
    <div id="backStatus"></div>
    <div id="internetStatus"></div>
    <div id="tvStartStatus"></div>
    <div id="usbLocked">USB Locked</div>
    <div id="osdLocked">OSD Locked</div>
    <div id="shareScreenLocked">Share Screen Locked</div>
    <div id="autoNextActive">
      <font color="#FFDB00">Auto Next Content</font>
    </div>
    <div id="upgradeFirmwareStat"></div>
    <div id="socketStatusServer"></div>
    <div id="socketStatusClient"></div>
    <div id="socketData"></div>
    <div id="playerDebug"></div>
    <div id="userNotif"></div>

    <div id="videoPlayerFrame" style="display: none">
      <video id="videoPlayerA" src="" poster="" texture></video>
      <video id="videoPlayerB" src="" poster="" texture></video>
    </div>

    <video
      id="legacyVideoPlayer"
      style="
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      "
      preload="auto"
      autoplay
    ></video>
    <img
      id="videoPoster"
      style="
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      "
      src=""
    />

    <div id="qrblock"><div id="qrcode"></div></div>

    <script type="text/javascript">
      (function () {
        var gatekeeper = document.getElementById("compatibilityGatekeeper");
        var title = document.getElementById("gatekeeperTitle");
        var msg = document.getElementById("gatekeeperMessage");

        var supportsWASM = typeof window.WebAssembly === "object";

        if (!supportsWASM) {
          title.innerHTML = "Hardware Unsupported";
          title.style.color = "#ff4444";
          msg.innerHTML =
            "This application requires WebAssembly support. This panel runs a legacy platform web engine and cannot execute this application core layer.";
          throw new Error("Application halted: WebAssembly missing.");
        }

        // ✨ UPDATED: This function now clears BOTH screens out of the way simultaneously
        window.hideGatekeeper = function () {
          if (gatekeeper) {
            gatekeeper.style.display = "none";
          }
          var bootScreen = document.getElementById("bootScreen");
          if (bootScreen) {
            bootScreen.style.display = "none";
          }
          console.log(
            "🚀 [UI System] Splash elements cleared. Signage interface rendering active."
          );
        };
      })();
    </script>

    <script src="adapter.js"></script>
  </body>
</html>
