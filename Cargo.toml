[package]
name = "rust_lg_adapter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

# JSON payload utilities for command string parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Target utilities to handle native JS structures
js-sys = "0.3"

# Browser API mappings explicitly optimized for your webOS DOM switching logic
[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration"
]